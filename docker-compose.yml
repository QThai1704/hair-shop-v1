version: '3.9'

services:
  api-service-dev:
    container_name: api-container-dev
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - '8081:80'
    networks:
      - backend

  api-service-test:
    container_name: api-container-test
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - '8082:80'
    networks:
      - backend

  api-service-prod:
    container_name: api-container-prod
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - '8083:80'
    networks:
      - backend

networks:
  backend:
    driver: bridge